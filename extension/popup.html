<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAPIDS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img
          class="mark"
          src="icons/icon48.png"
          width="30"
          height="30"
          alt=""
        />
        <div class="brand-text">
          <span class="eyebrow">Browser handoff</span>
          <h1>RAPIDS</h1>
        </div>
      </div>
      <p class="summary" id="summary" aria-live="polite">
        Checking this page...
      </p>
    </header>

    <div class="error" id="error" role="alert" hidden></div>
    <main class="list" id="items" aria-live="polite"></main>

    <footer class="footer">
      <button class="scan" id="scan" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path
            d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11M5 8h6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
        </svg>
        <span>Scan this page</span>
      </button>
      <a
        class="gear"
        id="options"
        href="options.html"
        target="_blank"
        rel="noopener"
        title="RAPIDS options"
        aria-label="RAPIDS options"
      >
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <path
            d="M8.6 2.4h2.8l.4 2a6.3 6.3 0 0 1 1.5.9l1.9-.8 1.4 2.4-1.5 1.4a6 6 0 0 1 0 1.7l1.5 1.4-1.4 2.4-1.9-.8a6.3 6.3 0 0 1-1.5.9l-.4 2H8.6l-.4-2a6.3 6.3 0 0 1-1.5-.9l-1.9.8-1.4-2.4 1.5-1.4a6 6 0 0 1 0-1.7L3.4 6.9l1.4-2.4 1.9.8a6.3 6.3 0 0 1 1.5-.9l.4-2Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
          <circle
            cx="10"
            cy="9.3"
            r="2.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
          />
        </svg>
      </a>
    </footer>
    <p class="hint" id="hint"></p>

    <script src="popup.js"></script>
  </body>
</html>
