[package]
name = "rapids-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "RAPIDS segmented HTTP download engine"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }

[dev-dependencies]
rapids-test-support = { path = "../rapids-test-support" }
tempfile = "3"
