[package]
name = "rapids-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "RAPIDS queue, persistence, and scheduling core"
publish = false

[dependencies]
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3"
